<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lite-rain Pro Environment</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #060913;
            font-family: system-ui, sans-serif;
            color: #fff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            width: 320px;
            background: rgba(10, 15, 25, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8899cc;
        }

        .control-group {
            margin-bottom: 16px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #ccddee;
        }

        input[type=range] {
            width: 100%;
            margin-bottom: 5px;
            accent-color: #00eeff;
        }

        .presets {
            display: flex;
            gap: 8px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            background: #1a233a;
            color: #8899cc;
            border: 1px solid #2a3550;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: 0.2s;
        }

        button:hover {
            background: #2a3550;
            color: #fff;
        }

        button.active {
            background: #00eeff;
            color: #000;
            border-color: #00eeff;
            box-shadow: 0 0 15px rgba(0, 238, 255, 0.3);
        }
    </style>
</head>
<body>

<div id="panel">
    <h2>Weather Control Matrix</h2>

    <div class="control-group">
        <label>Density (Drops/Area) <span id="denVal">5.0</span></label>
        <input type="range" id="density" min="1" max="25" step="1" value="5">
    </div>

    <div class="control-group">
        <label>Wind Velocity <span id="windVal">200</span></label>
        <input type="range" id="wind" min="-1200" max="1200" step="50" value="200">
    </div>

    <div class="control-group">
        <label>Gravity (Terminal Vel) <span id="gravVal">1500</span></label>
        <input type="range" id="gravity" min="500" max="4000" step="100" value="1500">
    </div>

    <div class="presets">
        <button id="btnDrizzle">Drizzle</button>
        <button id="btnStorm" class="active">Storm</button>
        <button id="btnSquall">Squall</button>
    </div>
</div>

<canvas id="stage"></canvas>

<script type="module">
    import {RainEngine} from 'https://esm.run/@zakkster/lite-rain@1.0.0';

    // --- APP WIRING ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', {alpha: false}); // Optimization for full-screen opaque bg
    const engine = new RainEngine();

    let w = 0, h = 0;
    const dpr = window.devicePixelRatio || 1;

    function updateSize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', updateSize);
    updateSize();

    // UI Controls
    const dom = {
        den: document.getElementById('density'), denVal: document.getElementById('denVal'),
        wind: document.getElementById('wind'), windVal: document.getElementById('windVal'),
        grav: document.getElementById('gravity'), gravVal: document.getElementById('gravVal'),
        btns: [document.getElementById('btnDrizzle'), document.getElementById('btnStorm'), document.getElementById('btnSquall')]
    };

    function updateUI() {
        dom.denVal.innerText = dom.den.value + '.0';
        dom.windVal.innerText = dom.wind.value;
        dom.gravVal.innerText = dom.grav.value;
        engine.config.density = parseFloat(dom.den.value);
        engine.config.wind = parseFloat(dom.wind.value);
        engine.config.gravity = parseFloat(dom.grav.value);
    }

    [dom.den, dom.wind, dom.grav].forEach(el => el.addEventListener('input', updateUI));

    function switchPreset(btn, den, wind, grav) {
        dom.btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        dom.den.value = den;
        dom.wind.value = wind;
        dom.grav.value = grav;
        updateUI();
    }

    document.getElementById('btnDrizzle').onclick = (e) => switchPreset(e.target, 2, 20, 800);
    document.getElementById('btnStorm').onclick = (e) => switchPreset(e.target, 6, 200, 1500);
    document.getElementById('btnSquall').onclick = (e) => switchPreset(e.target, 20, 900, 3000);

    // Loop
    let lastTime = performance.now();

    function loop(time) {
        const dt = Math.min((time - lastTime) / 1000, 0.1);
        lastTime = time;

        // Manual clear rect with background color to utilize opaque canvas performance
        ctx.fillStyle = '#060913';
        ctx.fillRect(0, 0, w, h);

        engine.spawn(dt, w, h);
        engine.updateAndDraw(ctx, dt, w, h);

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
